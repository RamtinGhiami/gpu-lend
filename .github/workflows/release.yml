name: Build and release

# Builds GPU Lend for Windows, Linux and macOS. Run it by hand (Actions tab) to get the files as artifacts,
# or push a tag such as v2.0.1 to also publish them on a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\gpu_lend.iss
          Rename-Item "build\installer\GpuLend-Setup.exe" "GpuLend-Setup-${{ steps.v.outputs.version }}.exe"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "build\installer\GpuLend-${{ steps.v.outputs.version }}-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/installer/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Package
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')
          mkdir -p out dist/gpu-lend
          cp -r build/linux/x64/release/bundle/* dist/gpu-lend/
          cp scripts/install-linux.sh dist/gpu-lend/install.sh
          chmod +x dist/gpu-lend/install.sh
          tar -C dist -czf "out/GpuLend-$V-linux-x64.tar.gz" gpu-lend
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release
      - name: Package
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          mkdir -p out
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          # ad-hoc signature so the app starts on Apple Silicon (no paid developer account needed)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/GpuLend-$V-macos.zip"
          hdiutil create -volname "GPU Lend" -srcfolder "$APP" -ov -format UDZO "out/GpuLend-$V-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "GPU Lend ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" --clobber
